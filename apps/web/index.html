<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-03: light theme only (plan § Atlas element map → Shell → Theme); dark is A-13. -->
    <meta name="color-scheme" content="light" />
    <title>CountyLens</title>
    <!-- Atlas § 3 fonts, the same request tokens.css makes: Roboto, Roboto Mono, Material Symbols. -->
    <!-- ERR-44 (TC-081): start the run index request with the HTML, in parallel with the JS, on the
         routes that read published data; the app fetches the same URL with default init, so the
         preloaded response is reused. Static pages (Legal, Help, Coming soon) make no data request
         (TC-056), so they get no preload. -->
    <script>
      (function () {
        var p = location.pathname;
        if (p === "/" || /^\/(runs|data|tx|permits)(\/|$)/.test(p)) {
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = "fetch";
          l.href = "/runs/index.json";
          l.crossOrigin = "anonymous";
          document.head.appendChild(l);
        }
      })();
    </script>
    <!-- ERR-44: warm DNS+TCP+TLS to the CID copy host before the manifest fetch. vite.config.ts
         drops this tag when VITE_CID_COPY_HOST is unset at build time. -->
    <link rel="preconnect" href="https://%VITE_CID_COPY_HOST%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
