# A-11 Run 3, one-off (PO 2026-10-25): publish steps 3 (car-files) and 7 (release) from a GitHub
# runner instead of the laptop's home uplink. The CAR files are read from the public CID copy
# (CloudFront serves S3 key ipfs/<carCid> at https://<host>/<carCid>; written by step 5); Kubo add refuses any file whose CID differs
# from the manifest's carCid, and the release step re-hashes each CAR, so a bad download fails.
# Runs only on a push to this branch; this branch is never merged. No AWS credentials are used.
# Filebase keys come from repository secrets and are never printed; GITHUB_TOKEN is the job's own.
name: run3-cloud-publish

on:
  push:
    branches: [run3-cloud-publish]

permissions:
  contents: write

concurrency:
  group: run3-cloud-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUN_ID: travis-full-run3-20261025
      MANIFEST: runs/travis-full-run3-20261025/manifest.json
      CID_COPY_HOST: ${{ vars.CID_COPY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Download the CAR files from the CID copy
        run: |
          node --input-type=module -e '
          import { readFileSync, mkdirSync, statSync } from "node:fs";
          import { dirname, join } from "node:path";
          import { execFileSync } from "node:child_process";
          const m = JSON.parse(readFileSync(process.env.MANIFEST, "utf8"));
          const host = process.env.CID_COPY_HOST;
          if (!host) throw new Error("CID_COPY_HOST repository variable is not set");
          const items = m.artifacts.filter((a) => a.carCid).map((a) => ({
            path: a.kind === "directory" ? join(a.name, "tables.car") : a.name,
            url: `https://${host}/${a.carCid}`,
            size: a.kind === "car" ? a.size : undefined,
          }));
          for (const it of items) {
            mkdirSync(dirname(it.path), { recursive: true });
            execFileSync("curl", ["-fsS", "--retry", "5", "--retry-all-errors", "-o", it.path, it.url], { stdio: "inherit" });
            const got = statSync(it.path).size;
            if (it.size !== undefined && got !== it.size) throw new Error(`${it.path}: size ${got}, manifest ${it.size}`);
            console.log(`fetched ${it.path} (${got} bytes)`);
          }
          console.log(`${items.length} CAR files fetched`);
          '

      - name: Step 3 car-files (Filebase readback only; Pinata deferred to A-16 item 14)
        env:
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          FILEBASE_BUCKET: ${{ secrets.FILEBASE_BUCKET }}
          PUBLISH_DEFER_PINATA: "1"
          PUBLISH_CARFILES_NO_PROBE: "1"
        run: |
          export NODE_OPTIONS="--import $(node -e "console.log(require('path').dirname(require.resolve('tsx'))+'/loader.mjs')") --import $PWD/pipeline/publish/scripts/fetch-retry.ts"
          npx tsx pipeline/publish/scripts/publish-run.ts --manifest "$MANIFEST" --run-id "$RUN_ID" \
            --release-target feature/oracle-pipeline --repo "$GITHUB_REPOSITORY" --step car-files

      - name: Step 7 GitHub release (CARs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx tsx pipeline/publish/scripts/publish-run.ts --manifest "$MANIFEST" --run-id "$RUN_ID" \
            --release-target feature/oracle-pipeline --repo "$GITHUB_REPOSITORY" --step release

      - name: Keep the receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run3-receipts
          path: specs/011-publish-and-runs/upload-receipts/travis-full-run3-20261025/
          if-no-files-found: warn
