# A-01 T052 (research R12): CI for the discovery runtime until A-03 folds it into the
# Turborepo CI. No network calls to county sources and no secrets: unit tests use injected
# fetches and synthetic fixtures only; the acceptance suite (live recounts) is not run here.
name: pipeline-ci

on:
  push:
    paths:
      - "pipeline/oracle-runtime/**"
      - "pipeline/docs/travis-sources.yaml"
      - "docs/evidence/A-01-readiness.json"
      - ".github/workflows/pipeline-ci.yml"
  pull_request:
    paths:
      - "pipeline/oracle-runtime/**"
      - "pipeline/docs/travis-sources.yaml"
      - "docs/evidence/A-01-readiness.json"
      - ".github/workflows/pipeline-ci.yml"

permissions:
  contents: read

concurrency:
  group: pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline/oracle-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/oracle-runtime/package-lock.json

      # The vendored kit validator reads YAML with PyYAML when it is installed (parser parity
      # with its built-in reader is checked in the story evidence, T050).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Readiness validator self-test (vendored kit, unmodified)
        run: python3 kit/use-oracle/scripts/validate-county-readiness.py --self-test

      # OR-M5: the committed catalog passes the A-01 checker, and the vendored validator's
      # report on it is byte-identical to the committed readiness report (no network: both
      # read only the YAML file).
      - name: Check the committed catalog (check-catalog rules 1-11)
        run: npm run check-catalog

      - name: Validator on the committed catalog equals docs/evidence/A-01-readiness.json
        working-directory: .
        run: |
          set +e
          python3 pipeline/oracle-runtime/kit/use-oracle/scripts/validate-county-readiness.py \
            pipeline/docs/travis-sources.yaml > "$RUNNER_TEMP/readiness.json"
          code=$?
          set -e
          echo "validator exit $code"
          diff -u docs/evidence/A-01-readiness.json "$RUNNER_TEMP/readiness.json"
          test "$code" -eq 0
